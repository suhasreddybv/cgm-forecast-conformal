name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # CPU wheels: the default index resolves torch to CUDA builds of several GB on ubuntu.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt
      # OhioT1DM is under a data use agreement and is not available to CI, so the dataset-backed tests skip by design.
      # The decision-log guard and every synthetic test run here.
      - run: pytest -q
